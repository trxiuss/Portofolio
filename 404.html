  <style>
    .nf-page { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 30px; }

      font-size: clamp(5rem, 18vw, 9.5rem); font-weight: 800; line-height: 1;
      background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 10px 30px rgba(255, 77, 0, .35)); margin-bottom: 14px;
      animation: nf-float 4s var(--ease) infinite alternate;
    }
    @keyframes nf-float { from { transform: translateY(0); } to { transform: translateY(-10px); } }
    .nf-desc { color: var(--muted); font-size: 1.05rem; margin: 10px 0 32px; line-height: 1.7; }
  </style>
</head>

  <main class="nf-page">
